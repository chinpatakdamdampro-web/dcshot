# DiscordShot configuration
# ---------------------------------------------------------------------------
# How it works (no browser needed):
#   BlueMap exposes flat 2D tile images as plain PNG files over HTTP.
#   This plugin fetches the right tile for the requested coordinates,
#   stitches a 3×3 grid of tiles into one image using Java's own ImageIO,
#   and uploads it to Discord — zero external binaries required.
# ---------------------------------------------------------------------------

# Your Discord bot token — keep this secret!
bot-token: "PASTE_BOT_TOKEN_HERE"

# Restrict /screenshot to a specific channel. Leave empty to allow any channel.
allowed-channel-id: ""

# Register the slash command instantly to one guild (server) by pasting its ID.
# Leave empty for global registration (can take up to an hour to appear).
guild-id: ""

# BlueMap web-server URL as seen from this machine (usually localhost).
bluemap-url: "http://localhost:8100"

# Public-facing BlueMap URL shown as a clickable link in the Discord embed.
# Leave empty to omit the link.
public-map-url: ""

# World used when the Discord command omits the [world] argument.
default-world: "world"

# If a world's BlueMap map-ID differs from its Minecraft folder name, map it here.
# Example: world_nether: DIM-1
map-ids: {}

# Output image settings
image:
  # How many BlueMap tiles to stitch in each direction (e.g. 3 = 3×3 = 9 tiles).
  # BlueMap lowres tiles are 512×512 px each.
  grid-size: 3
  # Output format: PNG or JPEG
  format: PNG
  # JPEG quality (0–100), ignored for PNG
  jpeg-quality: 90

# Per-user cooldown in seconds (0 = no limit)
cooldown-seconds: 10
