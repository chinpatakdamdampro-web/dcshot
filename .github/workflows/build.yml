name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No platform profile here on purpose: this build includes Playwright's driver for
      # every OS, so the jar it produces works regardless of what OS the *Minecraft server*
      # (not this runner) happens to be on. See the README for smaller, single-OS builds.
      - name: Build with Maven
        run: mvn -B package

      - name: Upload built plugin
        uses: actions/upload-artifact@v4
        with:
          name: DiscordShot-plugin
          path: target/DiscordShot-*.jar
          if-no-files-found: error
